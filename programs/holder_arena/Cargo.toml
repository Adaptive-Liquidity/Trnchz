[package]
name = "holder_arena"
version = "0.1.0"
description = "Holder v. Holder — locked-position arena (scaffold)"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "holder_arena"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["associated_token", "token"] }
# Unify with `solana-program` but pin: blake3 1.8+ pulls digest 0.11 / crates that need rustc newer than Solana 1.18 `cargo-build-sbf`.
blake3 = "=1.5.5"
# Pin 3.x line: 3.5+ pulls `toml_edit`/`toml_parser` manifests that require Cargo edition2024 support absent from platform-tools cargo (~1.75).
proc-macro-crate = "=3.1.0"
# 1.13+ declares MSRV 1.85; pulls in via `heck` (Anchor / spl token naming).
unicode-segmentation = "=1.12.0"
# 2.13+ requires rustc 1.82+.
indexmap = "=2.6.0"
# 1.0.228 splits `serde_core` + `include!(.../private.rs)`; breaks Windows BPF build (os error 123 on `\\?\` paths).
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

# Pin transitive `borsh` for Solana 1.18 BPF (1.6+ needs rustc 1.77+). Listed here — not in [dependencies] — so the
# crate is not a direct `extern` and does not clash with `anchor_lang::prelude::*` (`borsh` name ambiguity).
[build-dependencies]
borsh = "=1.5.5"
